<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="description" content="Éditeur de fiches horaires de navettes au standard de transport. 100% hors-ligne, export PNG et impression A4." />
<meta name="theme-color" content="#0f172a" />
<title>Générateur de fiches horaires</title>
<link rel="stylesheet" href="fonts/manrope.css">
  <script src="lib/html2canvas.min.js"></script>
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-secondary: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-soft: #475569;
    --text-muted: #64748b;
    --accent: #0284c7;
    --accent-hover: #0369a1;
    --accent-light: #e0f2fe;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --warning: #d97706;
    --warning-light: #fef3c7;
    --success: #059669;
    --success-light: #d1fae5;
    --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
    --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-secondary: #0f172a;
      --border: #334155;
      --border-strong: #475569;
      --text: #f8fafc;
      --text-soft: #cbd5e1;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --accent-light: rgba(56, 189, 248, 0.15);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.2);
      --warning: #f59e0b;
      --warning-light: rgba(245, 158, 11, 0.2);
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.2);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 24px 0 rgba(0, 0, 0, 0.5);
    }
  }

  html, body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Chiffres tabulaires sur tous les affichages d'horaires */
  .time-input,
  table.horaires-edit input,
  .fiche-table,
  .fiche-table th,
  .fiche-table td,
  .tp-btn,
  .hour-head,
  .col-num {
    font-variant-numeric: tabular-nums lining-nums;
    font-feature-settings: "tnum" 1;
  }

  /* Header Applicatif */
  header.app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }

  .header-brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-soft);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-secondary);
    transition: all 0.15s ease;
  }
  .nav-back-link:hover {
    color: var(--text);
    border-color: var(--border-strong);
    background: var(--surface);
  }

  header.app-header h1 {
    font-size: 20px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.03em;
    color: var(--text);
    cursor: pointer;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  header.app-header h1 span {
    color: var(--accent);
  }

  .ks-badge-status {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--surface-secondary);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  @media (max-width: 640px) {
    header.app-header {
      padding: 10px 14px;
      flex-wrap: wrap;
    }
    .header-brand-row {
      width: 100%;
      justify-content: space-between;
    }
    .header-actions {
      width: 100%;
      justify-content: flex-start;
    }
  }

  body.is-home header.app-header h1 { display: flex; }
  body.is-empty .sidebar { display: none; }

  body.is-home main #main-content {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 120px);
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* Buttons Standards */
  button, .btn-link {
    font-family: inherit;
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    line-height: 1.2;
    min-height: 38px;
  }
  button:active {
    transform: translateY(1px);
  }
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-header-main, .btn-primary {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    font-weight: 800;
    box-shadow: 0 1px 2px rgba(2, 132, 199, 0.2);
  }
  .btn-header-main:hover, .btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .btn-header-util, .btn-secondary {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 700;
    box-shadow: var(--shadow-sm);
  }
  .btn-header-util:hover, .btn-secondary:hover {
    background: var(--surface-secondary);
    border-color: var(--border-strong);
  }

  .btn-danger {
    background: var(--danger-light);
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .btn-danger:hover {
    background: var(--danger);
    color: #ffffff;
  }

  .btn-icon {
    padding: 6px 10px;
    background: transparent;
    color: var(--text-soft);
    border: 1px solid transparent;
    min-height: 32px;
  }
  .btn-icon:hover {
    background: var(--surface-secondary);
    color: var(--text);
    border-color: var(--border);
  }
  .btn-small {
    padding: 6px 12px;
    font-size: 12px;
    min-height: 32px;
  }

  /* Main Layout */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 900px) {
    main {
      grid-template-columns: 1fr;
      padding: 16px 12px;
    }
    .sidebar {
      position: static;
      max-height: none;
    }
  }

  /* Sidebar */
  .sidebar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 76px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }
  .sidebar h2 {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .fiche-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .fiche-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    transition: all 0.15s ease;
  }
  .fiche-item:hover {
    background: var(--surface-secondary);
    border-color: var(--border);
  }
  .fiche-item.active {
    background: var(--accent-light);
    border-color: var(--accent);
  }
  .fiche-logo-mini {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    flex-shrink: 0;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    background-color: #ffffff;
    border: 1px solid var(--border);
  }
  .fiche-name {
    font-weight: 700;
    font-size: 13px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .fiche-empty {
    padding: 24px 12px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    background: var(--surface-secondary);
    border-radius: 8px;
    border: 1px dashed var(--border);
  }

  /* Content & Panels */
  .content {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: var(--shadow-sm);
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  /* Bandeau d'instruments Tactile (Instrument Strip Navigation) */
  .panel-tabs {
    display: inline-flex;
    background: var(--surface-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 24px;
    margin-top: -6px;
    max-width: 100%;
    overflow-x: auto;
  }
  .tab-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 36px;
  }
  .tab-btn:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.6);
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border-strong);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
  }

  /* Formulaires Techniques */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-group.full { grid-column: 1 / -1; }
  label {
    font-size: 11px;
    font-weight: 800;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  input[type="text"], input[type="time"], textarea, select {
    font-family: inherit;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--text);
    width: 100%;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus, input[type="time"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  input[type="color"] {
    width: 100%;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    cursor: pointer;
    background: var(--surface);
  }

  .logo-uploader {
    border: 1px dashed var(--border-strong);
    background: var(--surface-secondary);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo-preview {
    width: 110px;
    height: 65px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 6px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    flex-shrink: 0;
  }
  .logo-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .file-input { display: none; }
  .logo-presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .logo-preset-btn {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .logo-preset-btn img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  .logo-preset-btn:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  /* Jours de circulation */
  .days-toggle {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .day-btn {
    background: var(--surface);
    color: var(--text-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    min-width: 52px;
    text-align: center;
    transition: all 0.15s ease;
  }
  .day-btn:hover {
    background: var(--surface-secondary);
    border-color: var(--border-strong);
  }
  .day-btn.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  .days-preview {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-soft);
  }
  .days-preview strong {
    color: var(--text);
    font-weight: 700;
  }

  /* Arrêts & Drag & Drop */
  .arrets-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .arret-row {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: grab;
    transition: all 0.15s ease;
  }
  .arret-row::before {
    content: "⋮⋮";
    color: var(--text-muted);
    font-size: 16px;
    cursor: grab;
  }
  .arret-row:active { cursor: grabbing; }
  .arret-row.dragging { opacity: 0.5; background: var(--accent-light); }
  .arret-row.drag-over { border-top: 2px solid var(--accent); }
  .arret-row .arret-num {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-secondary);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text-soft);
    font-size: 11px;
    font-weight: 800;
  }
  .arret-row input {
    flex: 1;
    border: 1px solid transparent;
    background: transparent;
    padding: 6px 8px;
  }
  .arret-row input:focus {
    background: var(--surface);
    border-color: var(--border-strong);
    box-shadow: none;
  }
  .arret-empty {
    padding: 20px;
    background: var(--surface-secondary);
    border-radius: 8px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 12px;
    border: 1px dashed var(--border);
  }

  .autofill-btn {
    padding: 4px 8px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 4px;
    font-size: 11px;
    font-weight: 800;
    margin-top: 4px;
    border: 1px solid var(--accent);
  }
  .autofill-btn:hover {
    background: var(--accent);
    color: #ffffff;
  }

  /* Table d'édition des Horaires */
  .horaires-section { margin-top: 24px; }
  .horaires-section h3 {
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 12px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .horaires-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
  }
  table.horaires-edit {
    border-collapse: collapse;
    min-width: 100%;
  }
  table.horaires-edit th, table.horaires-edit td {
    padding: 6px 8px;
    border: 1px solid var(--border);
    font-size: 13px;
    vertical-align: middle;
    text-align: center;
  }
  table.horaires-edit th {
    background: var(--surface-secondary);
    font-weight: 800;
    color: var(--text-soft);
    text-align: left;
    padding: 8px 12px;
    position: sticky;
    left: 0;
    z-index: 1;
    min-width: 150px;
  }
  table.horaires-edit td.arret-label {
    background: var(--surface-secondary);
    font-weight: 700;
    text-align: left;
    padding: 8px 12px;
    position: sticky;
    left: 0;
    z-index: 1;
    min-width: 150px;
    max-width: 180px;
    color: var(--text);
  }
  table.horaires-edit input.time-input {
    border: 1px solid transparent;
    background: transparent;
    padding: 6px;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    width: 68px;
    border-radius: 4px;
  }
  table.horaires-edit input.time-input:focus,
  table.horaires-edit input.time-input.focused {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
    outline: none;
  }
  .time-input.time-conflict {
    border: 1.5px dashed var(--warning) !important;
    color: #b45309 !important;
    background: var(--warning-light) !important;
  }

  /* Quick Time Picker UI Tactile */
  .time-picker-overlay {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border-strong);
    padding: 12px;
    z-index: 1000;
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.12);
    max-width: 480px;
    margin: 0 auto;
    border-radius: 12px 12px 0 0;
  }
  .time-picker-overlay.show { display: grid; }
  body.picker-open { padding-bottom: 280px; }
  .tp-btn {
    background: var(--surface-secondary);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 8px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 800;
    justify-content: center;
    box-shadow: var(--shadow-sm);
    min-height: 48px;
  }
  .tp-btn:active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(1px);
  }
  .tp-btn.accent {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  .tp-btn.danger {
    color: var(--danger);
  }

  /* Hero Section (Welcome state) */
  .hero-welcome {
    text-align: center;
    padding: 60px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    max-width: 480px;
    margin: 40px auto;
  }
  .hero-icon {
    width: 80px;
    height: 80px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    border: 1px solid var(--accent);
  }
  .hero-welcome h2 {
    font-size: 26px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.03em;
    line-height: 1.2;
  }
  .hero-welcome h2 span { color: var(--accent); }
  .hero-welcome p {
    font-size: 15px;
    color: var(--text-soft);
    line-height: 1.5;
  }
  .btn-hero-primary {
    background: var(--accent);
    color: #ffffff;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 800;
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-hero-primary:hover {
    background: var(--accent-hover);
  }

  /* Fiche Render Vectoriel (Aperçu) */
  .fiche-render {
    background: #ffffff;
    color: #000000;
    padding: 24px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    box-shadow: var(--shadow);
    max-width: 900px;
    margin: 0 auto;
  }
  .fiche-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #0f172a;
    padding-bottom: 12px;
    margin-bottom: 16px;
    gap: 16px;
  }
  .fiche-title h2 {
    font-size: 20px;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.02em;
  }
  .fiche-title p {
    font-size: 13px;
    font-weight: 700;
    color: #475569;
  }
  .fiche-logo {
    max-width: 140px;
    max-height: 60px;
    object-fit: contain;
  }
  .fiche-table-wrap {
    margin-bottom: 20px;
  }
  .fiche-table-banner {
    color: #ffffff;
    font-weight: 800;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 4px 4px 0 0;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  table.fiche-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    color: #000000;
    border: 1px solid #94a3b8;
  }
  table.fiche-table th, table.fiche-table td {
    border: 1px solid #cbd5e1;
    padding: 5px 8px;
    text-align: center;
  }
  table.fiche-table th.arret-header {
    text-align: left;
    font-weight: 800;
    background: #f1f5f9;
    width: 180px;
  }
  table.fiche-table td.arret-cell {
    text-align: left;
    font-weight: 700;
    background: #f8fafc;
  }
  table.fiche-table th.hour-head {
    background: #e2e8f0;
    font-weight: 800;
  }
  .fiche-legende {
    font-size: 11px;
    color: #64748b;
    margin-top: 12px;
    line-height: 1.4;
  }

  /* Modale Confirmation */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: var(--shadow-lg);
  }
  .modal h3 {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 8px;
    color: var(--text);
  }
  .modal p {
    color: var(--text-soft);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f172a;
    color: #ffffff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 9999;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
    border: 1px solid #334155;
    text-align: center;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Fullscreen Preview Overlay */
  .fullscreen-preview {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    display: none;
    flex-direction: column;
    padding: 20px;
    overflow-y: auto;
  }
  .fullscreen-preview.show { display: flex; }
  .close-preview {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1001;
    background: var(--danger);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    border: none;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .preview-container {
    max-width: 1000px;
    margin: 40px auto;
    width: 100%;
  }

  /* Impression A4 Professionnelle */
  @media print {
    @page { size: A4 portrait; margin: 10mm; }
    body {
      background: #ffffff !important;
      color: #000000 !important;
      padding: 0 !important;
      margin: 0 !important;
      font-size: 10pt !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .app-header, .sidebar, .panel-tabs, .header-actions,
    .time-picker-overlay, .modal-overlay, .toast, .btn-primary, .btn-secondary,
    .btn-danger, .autofill-btn, #live-preview, .fullscreen-preview,
    .preview-actions, #btn-share-png, #btn-export-png, #btn-export-html, #btn-print, #btn-fullscreen {
      display: none !important;
    }
    main { display: block !important; padding: 0 !important; margin: 0 !important; }
    .content, .panel { padding: 0 !important; margin: 0 !important; border: none !important; box-shadow: none !important; background: transparent !important; }
    .fiche-render {
      display: block !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
      max-width: 100% !important;
    }
    .fiche-header, .fiche-table-wrap {
      break-inside: avoid;
      page-break-inside: avoid;
    }
  }

  </style>
</head>

<header class="app-header" id="app-header">
  <div class="header-brand-row">
    <a href="index.html" class="nav-back-link" title="Retourner à la page de présentation">← Présentation</a>
    <h1 id="app-title" onclick="state.currentFicheId = null; saveState(); render();" role="button" tabindex="0" aria-label="Retourner à l'accueil">
      FICHES <span>HORAIRES</span>

  </div>
  <div class="header-actions">
    <button class="btn-header-main" id="btn-new-fiche" aria-label="Créer une nouvelle fiche horaire">+ Nouvelle fiche</button>
    <button class="btn-header-util" id="btn-export-all" aria-label="Exporter toutes les fiches en fichier JSON">📤 Export JSON</button>
    <button class="btn-header-util" id="btn-import-all" aria-label="Importer des fiches depuis un fichier JSON">📥 Import JSON</button>

<main>
  <aside class="sidebar">

  </aside>
  <section class="content" id="main-content"></section>
</main>

<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h3 id="modal-title">Confirmer</h3>
    <p id="modal-message"></p>
    <div class="modal-actions">
      <button class="btn-secondary" id="modal-cancel" aria-label="Annuler l'action">Annuler</button>
      <button class="btn-danger" id="modal-confirm" aria-label="Confirmer l'action">Confirmer</button>

  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="time-picker-overlay" id="time-picker" role="dialog" aria-modal="true" aria-label="Pavé de saisie d'horaire">
  <button class="tp-btn" data-val="1" aria-label="Touche 1">1</button>
  <button class="tp-btn" data-val="2" aria-label="Touche 2">2</button>
  <button class="tp-btn" data-val="3" aria-label="Touche 3">3</button>
  <button class="tp-btn accent" id="tp-next" aria-label="Passer à l'arrêt suivant">SUIV. ➔</button>

  <button class="tp-btn" data-val="4" aria-label="Touche 4">4</button>
  <button class="tp-btn" data-val="5" aria-label="Touche 5">5</button>
  <button class="tp-btn" data-val="6" aria-label="Touche 6">6</button>
  <button class="tp-btn accent" data-val=":" aria-label="Séparateur deux-points horaire">:</button>

  <button class="tp-btn" data-val="7" aria-label="Touche 7">7</button>
  <button class="tp-btn" data-val="8" aria-label="Touche 8">8</button>
  <button class="tp-btn" data-val="9" aria-label="Touche 9">9</button>
  <button class="tp-btn accent" data-val="ALD" aria-label="Arrêt à la demande (ALD)">ALD</button>

  <button class="tp-btn danger" id="tp-clear" aria-label="Effacer le dernier caractère">⌫</button>
  <button class="tp-btn" data-val="0" aria-label="Touche 0">0</button>
  <button class="tp-btn" data-val="—" aria-label="Pas de passage">—</button>
  <button class="tp-btn accent" id="tp-close" aria-label="Valider l'horaire">OK</button>
</div>

// ---------- QUICK TIME PICKER LOGIC ----------
let activeInput = null;

function openTimePicker(input) {
  // Si on switche vers un AUTRE input (clic sur une autre cellule), 
  // on finalise d'abord la valeur de l'input précédent
  if (activeInput && activeInput !== input) {
    const finalized = finalizeTime(activeInput.value);
    if (finalized !== activeInput.value) {
      activeInput.value = finalized;
      activeInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }
  activeInput = input;
  const picker = document.getElementById('time-picker');
  picker.classList.add('show');
  document.body.classList.add('picker-open');

  // Highlight active input
  document.querySelectorAll('.time-input').forEach(i => i.classList.remove('focused'));
  input.classList.add('focused');

  // Vibration pour retour haptique
  if (typeof AndroidBlob !== 'undefined') AndroidBlob.vibrate(15);

  // Scroll précis : s'assurer que l'input est entre le header et le picker.
  // On attend un RAF pour que picker.offsetHeight soit mesurable après .show.
  requestAnimationFrame(() => {
    const pickerH = picker.offsetHeight;
    const headerEl = document.querySelector('header.app-header');
    const headerH = headerEl ? headerEl.offsetHeight : 60;
    const rect = input.getBoundingClientRect();
    const safeTop = headerH + 20;
    const safeBottom = window.innerHeight - pickerH - 20;

    if (rect.bottom > safeBottom) {
      // L'input est recouvert par le picker → on remonte pour qu'il soit ~80px au-dessus
      window.scrollBy({ top: rect.bottom - safeBottom + 60, behavior: 'smooth' });
    } else if (rect.top < safeTop) {
      // L'input est caché sous le header → on descend
      window.scrollBy({ top: rect.top - safeTop, behavior: 'smooth' });
    }
  });
}

function closeTimePicker() {
  // Finaliser la valeur de l'input courant avant de fermer (bouton OK ou tap ailleurs)
  if (activeInput) {
    const finalized = finalizeTime(activeInput.value);
    if (finalized !== activeInput.value) {
      activeInput.value = finalized;
      activeInput.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }
  document.getElementById('time-picker').classList.remove('show');
  document.body.classList.remove('picker-open');
  if (activeInput) activeInput.classList.remove('focused');
  activeInput = null;
}

// Global listeners for picker buttons
document.querySelectorAll('.tp-btn[data-val]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!activeInput) return;
    const val = btn.dataset.val;
    const current = activeInput.value;

    // Calculer la nouvelle valeur de l'input
    let newValue;
    let shouldAutoTab = false;
    if (val === 'ALD' || val === '—') {
      newValue = val;
      shouldAutoTab = true;
    } else {
      newValue = autoFormatTime(current + val);
      // Auto-tabulation dès que le format HH:MM ou H:MM est valide
      if (/^\d{1,2}:\d{2}$/.test(newValue)) shouldAutoTab = true;
    }

    // 1) Mettre à jour l'input courant
    activeInput.value = newValue;

    // 2) Sauvegarder dans le state AVANT de changer activeInput
    //    (sinon triggerAutoTab() repointe activeInput sur l'input suivant
    //     et le listener `input` n'est jamais déclenché sur l'ancien)
    const inputToSave = activeInput;
    const saveEvent = new Event('input', { bubbles: true });
    inputToSave.dispatchEvent(saveEvent);

    // 3) Vibration retour haptique
    if (typeof AndroidBlob !== 'undefined') AndroidBlob.vibrate(10);

    // 4) Maintenant on peut passer à l'input suivant si besoin
    if (shouldAutoTab) triggerAutoTab();
  });
});

document.getElementById('tp-clear').addEventListener('click', () => {
  if (activeInput) {
    activeInput.value = activeInput.value.slice(0, -1);
    activeInput.dispatchEvent(new Event('input', { bubbles: true }));
  }
});

document.getElementById('tp-close').addEventListener('click', closeTimePicker);

document.getElementById('tp-next').addEventListener('click', () => {
  triggerAutoTab();
});

function triggerAutoTab() {
  if (!activeInput) return;
  // Avant de quitter l'input courant, on finalise sa valeur si elle est incomplète
  // (ex: "070" → "07:00", "07" → "07:00", "745" → "7:45")
  const finalized = finalizeTime(activeInput.value);
  if (finalized !== activeInput.value) {
    activeInput.value = finalized;
    activeInput.dispatchEvent(new Event('input', { bubbles: true }));
  }
  const allInputs = Array.from(document.querySelectorAll('.time-input'));
  const idx = allInputs.indexOf(activeInput);
  if (idx < allInputs.length - 1) {
    openTimePicker(allInputs[idx + 1]);
  } else {
    closeTimePicker();
  }
}
let state = { fiches: [], currentFicheId: null, activeTab: 'general' };

// ---------- UTILS ----------
function uid() { return 'f_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7); }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }
function slugify(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'fiche';
}

// Téléchargement unifié : Android WebView (via bridge AndroidBlob) ou navigateur web (blob: URL)
function downloadFile(blob, filename) {
  if (typeof AndroidBlob !== 'undefined' && AndroidBlob && typeof AndroidBlob.save === 'function') {
    const reader = new FileReader();
    reader.onloadend = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
      try { AndroidBlob.save(base64, blob.type || 'application/octet-stream', filename); }
      catch (e) { console.error('AndroidBlob.save error', e); }
    };
    reader.readAsDataURL(blob);
  } else {
    const link = document.createElement('a');
    link.download = filename;
    link.href = URL.createObjectURL(blob);
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 5000);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function confirmModal(title, message) {
  return new Promise((resolve) => {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-message').textContent = message;
    const overlay = document.getElementById('modal-overlay');
    overlay.classList.add('show');
    const cleanup = (v) => {
      overlay.classList.remove('show');
      document.getElementById('modal-confirm').onclick = null;
      document.getElementById('modal-cancel').onclick = null;
      resolve(v);
    };
    document.getElementById('modal-confirm').onclick = () => cleanup(true);
    document.getElementById('modal-cancel').onclick = () => cleanup(false);
  });
}

// ---------- JOURS DE VALIDITÉ ----------
const JOURS_NAMES = ['LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI', 'DIMANCHE'];
const JOURS_SHORT = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];

// Génère une phrase lisible à partir du tableau de 7 booléens
function joursToString(coches) {
  if (!Array.isArray(coches)) return '';
  const indices = [];
  for (let i = 0; i < 7; i++) if (coches[i]) indices.push(i);
  if (indices.length === 0) return '';
  if (indices.length === 7) return 'TOUS LES JOURS';
  // Cas usuels
  if (indices.length === 5 && indices.every((v, i) => v === i)) return 'DU LUNDI AU VENDREDI';
  if (indices.length === 2 && indices[0] === 5 && indices[1] === 6) return 'LE WEEK-END';
  if (indices.length === 1) return 'LE ' + JOURS_NAMES[indices[0]];
  // Plage continue ?
  let consecutive = true;
  for (let i = 1; i < indices.length; i++) {
    if (indices[i] !== indices[i - 1] + 1) { consecutive = false; break; }
  }
  if (consecutive && indices.length >= 3) {
    return 'DU ' + JOURS_NAMES[indices[0]] + ' AU ' + JOURS_NAMES[indices[indices.length - 1]];
  }
  // Liste : "LUNDI, MERCREDI ET VENDREDI"
  const names = indices.map(i => JOURS_NAMES[i]);
  if (names.length === 2) return names[0] + ' ET ' + names[1];
  return names.slice(0, -1).join(', ') + ' ET ' + names[names.length - 1];
}

// Tente de parser une ancienne string vers des coches (best-effort)
function parseJoursFromText(txt) {
  const t = String(txt || '').toUpperCase();
  if (t.includes('TOUS LES JOURS')) return [true, true, true, true, true, true, true];
  if (t.includes('WEEK-END') || t.includes('WEEKEND') || t.includes('WEEK END')) return [false, false, false, false, false, true, true];
  if (t.includes('LUNDI AU VENDREDI')) return [true, true, true, true, true, false, false];
  // Sinon, on coche les jours nommés explicitement
  const found = JOURS_NAMES.map(n => t.includes(n));
  if (found.some(Boolean)) return found;
  // Par défaut
  return [true, true, true, true, true, false, false];
}

// Migration des anciennes fiches (V1 → V2)
function migrateFiche(f) {
  if (f.ligne) {
    if (!f.titre) f.titre = 'NAVETTE BÉNÉVOLE';
    if (!f.logo) f.logo = DEFAULT_LOGO;
    delete f.ligne;
  }
  if (!f.titre) f.titre = 'NAVETTE BÉNÉVOLE';
  if (!f.logo) f.logo = DEFAULT_LOGO;
  if (f.legende === undefined) f.legende = '';
  if (!f.colors || typeof f.colors !== 'object') f.colors = {};
  if (!f.colors.sens1) f.colors.sens1 = '#009de0';
  if (!f.colors.sens2) f.colors.sens2 = '#1f2d5a';
  // Migration jours (string) → joursCoches (array of 7 bool)
  if (!Array.isArray(f.joursCoches) || f.joursCoches.length !== 7) {
    f.joursCoches = parseJoursFromText(f.jours || 'DU LUNDI AU VENDREDI');
  }
  if (f.jours !== undefined) delete f.jours;
  (f.sens || []).forEach(s => {
    if (s.direction !== undefined && (s.depart === undefined && s.arrivee === undefined)) {
      s.depart = '';
      s.arrivee = s.direction;
      delete s.direction;
    }
    if (s.depart === undefined) s.depart = '';
    if (s.arrivee === undefined) s.arrivee = '';
    if (!Array.isArray(s.arrets)) s.arrets = [];
    if (!Array.isArray(s.matin)) s.matin = [];
    if (!Array.isArray(s.soir)) s.soir = [];
  });
  return f;
}

// ---------- PERSISTANCE (localStorage navigateur) ----------
let storageAvailable = false;

function checkStorage() {
  try {
    const k = '__test_' + Date.now();
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    storageAvailable = true;
  } catch (e) {
    storageAvailable = false;
  }
}

function loadState() {
  if (!storageAvailable) return;
  try {
    const raw = localStorage.getItem('fiches-data');
    if (raw) {
      const data = JSON.parse(raw);
      state.fiches = (data.fiches || []).map(migrateFiche);
      state.currentFicheId = data.currentFicheId || (state.fiches[0] && state.fiches[0].id) || null;
    }
  } catch (e) {
    console.error('loadState error', e);
  }
}

let saveTimeout = null;
function saveState() {
  if (!storageAvailable) return; // mode mémoire seule, pas d'erreur affichée
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    saveStateImmediately();
  }, 300);
}

function saveStateImmediately() {
  if (!storageAvailable) return;
  if (saveTimeout) {
    clearTimeout(saveTimeout);
    saveTimeout = null;
  }
  try {
    localStorage.setItem('fiches-data', JSON.stringify({
      fiches: state.fiches,
      currentFicheId: state.currentFicheId
    }));
  } catch (e) {
    console.error('saveState error', e);
    if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014)) {
      showToast('Stockage saturé : supprime des fiches');
    } else {
      // Bascule en mode mémoire pour ne pas spammer l'utilisateur
      storageAvailable = false;
      showStorageWarning();
    }
  }
}

// Flush immédiat en cas de mise en arrière-plan ou fermeture de l'application
window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveStateImmediately();
});
window.addEventListener('pagehide', () => saveStateImmediately());
window.addEventListener('beforeunload', () => saveStateImmediately());

function showStorageWarning() {
  let bar = document.getElementById('storage-warning');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'storage-warning';
    bar.className = 'storage-warning';
    bar.innerHTML = '⚠️ <strong>Sauvegarde automatique impossible</strong> dans ce contexte (fichier ouvert depuis le gestionnaire de téléchargement). Utilise <strong>Export JSON</strong> pour sauvegarder tes fiches.';
    document.body.insertBefore(bar, document.body.firstChild);
  }
}

// Export / Import JSON pour persistance manuelle
function exportAllJSON() {
  const data = JSON.stringify({ fiches: state.fiches, currentFicheId: state.currentFicheId }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  downloadFile(blob, 'fiches-horaires-backup.json');
  showToast('Sauvegarde JSON téléchargée');
}

function importAllJSON(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.fiches || !Array.isArray(data.fiches)) throw new Error('Format invalide');
      state.fiches = data.fiches.map(migrateFiche);
      state.currentFicheId = data.currentFicheId || (state.fiches[0] && state.fiches[0].id) || null;
      saveState();
      render();
      showToast('Sauvegarde restaurée (' + state.fiches.length + ' fiches)');
    } catch (err) {
      showToast('Fichier JSON invalide');
    }
  };
  reader.readAsText(file);
}

// ---------- SIDEBAR ----------
function renderSidebar() {
  const list = document.getElementById('fiche-list');
  const header = document.getElementById('app-header');

  const isEmpty = state.fiches.length === 0;
  document.body.classList.toggle('is-empty', isEmpty);

  if (isEmpty) {
    list.innerHTML = '<div class="fiche-empty">Aucune fiche pour le moment.</div>';
    if (header) header.classList.remove('has-fiches');
    return;
  }

  if (header) header.classList.add('has-fiches');
  list.innerHTML = state.fiches.map(f => `
    <div class="fiche-item ${f.id === state.currentFicheId ? 'active' : ''}" data-id="${f.id}">
      <div class="fiche-logo-mini" style="background-image:url('${escapeAttr(f.logo || '')}')"></div>
      <div class="fiche-name">${escapeHtml(f.nom)}</div>
    </div>
  `).join('');
  list.querySelectorAll('.fiche-item').forEach(el => {
    el.addEventListener('click', () => {
      state.currentFicheId = el.dataset.id;
      saveState(); render();
    });
  });
}

    try {
      const reader = new FileReader();
      reader.onload = (re) => {
        const img = new Image();
        img.onload = () => {
          // Détection : l'image source a-t-elle de la transparence ? (PNG/WebP/SVG)
          // Si oui, on garde le fond transparent en sortie (PNG). Sinon JPEG plus léger.
          const isPng = /^data:image\/png/i.test(re.target.result)
                     || /^data:image\/webp/i.test(re.target.result)
                     || /^data:image\/svg/i.test(re.target.result);

          // Extraire les couleurs dominantes (si l'utilisateur le veut)

          // Redimensionner et compresser pour le stockage
          // 600px max (vs 400 avant) → meilleure qualité d'export PNG, ~120 Ko en JPEG 0.85
          const MAX_DIM = 600;
          const canvas = document.createElement('canvas');
          const ratio = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
          canvas.width = Math.round(img.width * ratio);
          canvas.height = Math.round(img.height * ratio);
          const ctx = canvas.getContext('2d');

          let dataUrl;
          if (isPng) {
            // Préserver la transparence → sortie en PNG
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            dataUrl = canvas.toDataURL('image/png');
          } else {
            // JPEG (plus léger), fond blanc pour éviter le noir
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        img.src = re.target.result;
      };

      reader.readAsDataURL(file);

    copy.id = uid();

    state.fiches.push(copy);

// Redimensionnement image client (max width donnée)
function resizeImageToDataURL(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => reject(new Error('Image invalide'));
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

        draggedIdx = parseInt(row.dataset.i);
        row.classList.add('dragging');
        if (typeof AndroidBlob !== 'undefined') AndroidBlob.vibrate(30);
      });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!row.classList.contains('drag-over')) {
          row.classList.add('drag-over');
          if (typeof AndroidBlob !== 'undefined') AndroidBlob.vibrate(5);
        }
      });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const targetIdx = parseInt(row.dataset.i);
        if (draggedIdx === targetIdx) return;

        // Move item in array
        const item = sens.arrets.splice(draggedIdx, 1)[0];
        sens.arrets.splice(targetIdx, 0, item);

        // Also move values in schedule columns
        sens.matin.forEach(col => {
          const val = col.splice(draggedIdx, 1)[0];
          col.splice(targetIdx, 0, val);
        });
        sens.soir.forEach(col => {
          const val = col.splice(draggedIdx, 1)[0];
          col.splice(targetIdx, 0, val);
        });

        saveState(); renderArrets(); renderHoraires();
      });

      const i = parseInt(row.dataset.i);
      row.querySelector('input').addEventListener('input', e => { sens.arrets[i] = e.target.value; saveState(); });
      row.querySelector('button[data-action="del"]').addEventListener('click', () => {
        sens.arrets.splice(i, 1);
        sens.matin.forEach(col => col.splice(i, 1));
        sens.soir.forEach(col => col.splice(i, 1));
        saveState(); renderArrets(); renderHoraires();
      });
    });
  }

  arretSection.querySelector('#btn-add-arret').addEventListener('click', () => {
    sens.arrets.push('');
    sens.matin.forEach(col => col.push(''));
    sens.soir.forEach(col => col.push(''));
    saveState(); renderArrets(); renderHoraires();
  });
  renderArrets();

  const matinSection = document.createElement('div');
  matinSection.className = 'horaires-section';
  matinSection.innerHTML = `
    <h3>
      <span>Horaires — MATIN <span class="badge">${sens.matin.length} départ${sens.matin.length > 1 ? 's' : ''}</span></span>
      <button class="btn-primary btn-small" id="btn-add-col-matin">+ Départ matin</button>
    </h3>
    <div id="container-matin"></div>`;
  wrap.appendChild(matinSection);

  const soirSection = document.createElement('div');
  soirSection.className = 'horaires-section';
  soirSection.innerHTML = `
    <h3>
      <span>Horaires — SOIR <span class="badge">${sens.soir.length} départ${sens.soir.length > 1 ? 's' : ''}</span></span>
      <button class="btn-primary btn-small" id="btn-add-col-soir">+ Départ soir</button>
    </h3>
    <div id="container-soir"></div>`;
  wrap.appendChild(soirSection);

  function renderHoraires() {
    renderHorairesTable(matinSection.querySelector('#container-matin'), sens, sens.matin);
    renderHorairesTable(soirSection.querySelector('#container-soir'), sens, sens.soir);
    matinSection.querySelector('h3 .badge').textContent = sens.matin.length + ' départ' + (sens.matin.length > 1 ? 's' : '');
    soirSection.querySelector('h3 .badge').textContent = sens.soir.length + ' départ' + (sens.soir.length > 1 ? 's' : '');
  }

  matinSection.querySelector('#btn-add-col-matin').addEventListener('click', () => {
    if (sens.arrets.length === 0) { showToast('Ajoute d’abord des arrêts'); return; }
    sens.matin.push(sens.arrets.map(() => ''));
    saveState(); renderHoraires();
  });
  soirSection.querySelector('#btn-add-col-soir').addEventListener('click', () => {
    if (sens.arrets.length === 0) { showToast('Ajoute d’abord des arrêts'); return; }
    sens.soir.push(sens.arrets.map(() => ''));
    saveState(); renderHoraires();
  });
  renderHoraires();

  return wrap;
}

function parseTimeToMinutes(str) {
  if (!str) return null;
  const m = String(str).trim().match(/^(\d{1,2})[:hH.](\d{2})$/);
  if (!m) return null;
  const h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  if (h < 0 || h > 23 || min < 0 || min > 59) return null;
  return h * 60 + min;
}

function isTimeInversion(currStr, prevStr) {
  const curr = parseTimeToMinutes(currStr);
  const prev = parseTimeToMinutes(prevStr);
  if (curr === null || prev === null) return false;
  if (curr < prev) {
    if (prev >= 21 * 60 && curr <= 5 * 60) return false; // passage de minuit valide
    return true;
  }
  return false;
}

function renderHorairesTable(container, sens, columns) {
  if (sens.arrets.length === 0) {
    container.innerHTML = '<div class="horaires-empty">Ajoute des arrêts pour pouvoir saisir des horaires.</div>';
    return;
  }
  if (columns.length === 0) {
    container.innerHTML = '<div class="horaires-empty">Aucun départ. Clique sur « + Départ » pour en ajouter.</div>';
    return;
  }
  let html = '<div class="horaires-wrap"><table class="horaires-edit"><thead><tr><th>Arrêt</th>';
  for (let c = 0; c < columns.length; c++) {
    html += `<th style="text-align:center; min-width:80px;">${c + 1}</th>`;
  }
  html += '<th class="col-action">×</th></tr></thead><tbody>';
  for (let r = 0; r < sens.arrets.length; r++) {
    html += `<tr><td class="arret-label">${escapeHtml(sens.arrets[r] || '(sans nom)')}</td>`;
    for (let c = 0; c < columns.length; c++) {
      const val = columns[c][r] || '';
      let prevVal = null;
      for (let pr = r - 1; pr >= 0; pr--) {
        if (columns[c][pr]) { prevVal = columns[c][pr]; break; }
      }
      const conflict = val && prevVal && isTimeInversion(val, prevVal);
      const conflictCls = conflict ? ' time-conflict' : '';
      const conflictTitle = conflict ? ' title="⚠️ Attention : cet horaire est antérieur à l’arrêt précédent !"' : '';
      const stopName = sens.arrets[r] || ('Arrêt ' + (r + 1));
      const ariaLbl = `Horaire départ ${c + 1} à ${stopName}`;
      html += `<td><input type="text" inputmode="none" readonly class="time-input${conflictCls}" value="${escapeAttr(val)}" placeholder="h:mm" data-r="${r}" data-c="${c}" aria-label="${escapeAttr(ariaLbl)}"${conflictTitle} /></td>`;
    }
    html += '<td></td></tr>';
  }
  html += '<tr><td class="arret-label" style="background:white; border:none;"></td>';
  for (let c = 0; c < columns.length; c++) {
    html += `<td class="col-action">
      <button class="btn-danger btn-small" data-delcol="${c}" aria-label="Supprimer le départ ${c + 1}">✕</button>
      <button class="autofill-btn" data-autofill="${c}" title="Propager avec +10 min" aria-label="Compléter départ ${c + 1} avec +10 minutes">🪄 +10m</button>
    </td>`;
  }
  html += '<td></td></tr></tbody></table></div>';
  container.innerHTML = html;

  container.querySelectorAll('.time-input').forEach(inp => {
    inp.addEventListener('click', e => {
      openTimePicker(e.target);
    });
  });

  container.querySelectorAll('button[data-autofill]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = parseInt(btn.dataset.autofill);
      const col = columns[c];
      let lastTime = null;

      for(let r=0; r < col.length; r++) {
        if (col[r] && col[r].includes(':')) {
          lastTime = col[r];
        } else if (lastTime) {
          const [h, m] = lastTime.split(':').map(Number);
          let newM = m + 10;
          let newH = h;
          if (newM >= 60) { newM -= 60; newH = (newH + 1) % 24; }
          lastTime = `${newH}:${String(newM).padStart(2, '0')}`;
          col[r] = lastTime;
        }
      }
      saveState();
      renderHorairesTable(container, sens, columns);
      showToast('Horaires complétés (+10 min)');
    });
  });

  container.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const r = parseInt(inp.dataset.r);
      const c = parseInt(inp.dataset.c);
      const formatted = autoFormatTime(e.target.value);
      if (formatted !== e.target.value) {
        e.target.value = formatted;
      }
      columns[c][r] = e.target.value;
      saveState();
    });
  });

  container.querySelectorAll('button[data-delcol]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = parseInt(btn.dataset.delcol);
      columns.splice(c, 1);
      saveState();
      btn.closest('.horaires-section').querySelector('.badge').textContent = columns.length + ' départ' + (columns.length > 1 ? 's' : '');
      renderHorairesTable(container, sens, columns);
    });
  });
}

// Auto-format d'un input horaire (24h) : 4 chiffres → HH:MM, 3 chiffres → H:MM (si 1er ≥ 3)
// Respecte les valeurs déjà formatées et les textes libres (ALD, etc.)
function autoFormatTime(val) {
  if (!val) return val;
  if (/[:hH.]/.test(val)) return val;
  if (!/^\d+$/.test(val)) return val;
  const d = val;
  if (d.length <= 2) return d;
  if (d.length === 3) {
    const first = parseInt(d[0], 10);
    if (first >= 3) return d.slice(0, 1) + ':' + d.slice(1);
    return d;
  }
  if (d.length === 4) return d.slice(0, 2) + ':' + d.slice(2);
  return d.slice(0, 2) + ':' + d.slice(2, 4);
}

// Formatage FINAL au moment de quitter l'input (SUIV, OK, ou clic ailleurs).
// Complète intelligemment les saisies partielles que autoFormatTime n'ose pas trancher :
//   "7"    → "7:00"   (1 chiffre = heure pile)
//   "07"   → "07:00"  (2 chiffres = heure pile)
//   "074"  → "07:40"  (3 chiffres, 1er<3 : interprété HH:M0 → HH:M0)
//   "745"  → "7:45"   (3 chiffres, 1er≥3 : interprété H:MM)
//   "0700" → "07:00"  (4 chiffres = standard)
function finalizeTime(val) {
  if (!val) return val;
  if (/[:hH.]/.test(val)) return val;     // déjà formaté (07:30, 7h30…)
  if (!/^\d+$/.test(val)) return val;     // texte libre (ALD, —, ...)
  const d = val;
  if (d.length === 1) return d + ':00';                       // "7" → "7:00"
  if (d.length === 2) return d + ':00';                       // "07" → "07:00"
  if (d.length === 3) {
    const first = parseInt(d[0], 10);
    if (first >= 3) return d[0] + ':' + d.slice(1);           // "745" → "7:45"
    return d.slice(0, 2) + ':' + d[2] + '0';                  // "074" → "07:40"
  }
  if (d.length >= 4) return d.slice(0, 2) + ':' + d.slice(2, 4);  // "0700" → "07:00"
  return d;
}

function swapInColumns(columns, i, j) {
  columns.forEach(col => { [col[i], col[j]] = [col[j], col[i]]; });
}

// Si le sens 2 est vide ou est encore l'inverse de l'ancien sens 1, on le synchronise.
// Dès que l'utilisateur édite le sens 2 manuellement, la propagation cesse.
function propagateMirror(f, oldDepart, oldArrivee) {
  const s2 = f.sens[1];
  const wasEmpty = !s2.depart && !s2.arrivee;
  const wasMirror = (s2.depart === oldArrivee) && (s2.arrivee === oldDepart);
  if (wasEmpty || wasMirror) {
    s2.depart = f.sens[0].arrivee;
    s2.arrivee = f.sens[0].depart;
  }
}

        if (pFiche.style.zoom === "" || pFiche.style.zoom === undefined) {
           pFiche.style.transform = `scale(${ratio})`;
        }
    }
  };

  setTimeout(fitToScreen, 100);
  window.addEventListener('resize', fitToScreen);
  // Observer les changements pour réagir au clavier
  if (window.ResizeObserver) {
    new ResizeObserver(() => fitToScreen()).observe(wrap);
  }

  wrap.querySelector('#btn-share-png').addEventListener('click', async () => {
    const target = wrap.querySelector('#fiche-render');
    showToast('📸 Capture en cours…');
    try {
      // Configuration html2canvas optimisée pour Android WebView
      const canvas = await html2canvas(target, {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true,
        logging: false,
        allowTaint: true
      });

      canvas.toBlob((blob) => {
        if (!blob) {
          showToast('Erreur : Capture impossible');
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = reader.result.split(',')[1];
          if (typeof AndroidBlob !== 'undefined') {
             AndroidBlob.share(base64, 'image/png', `fiche-${slugify(f.nom)}.png`);
          } else if (navigator.share && navigator.canShare) {
             const file = new File([blob], `fiche-${slugify(f.nom)}.png`, { type: 'image/png' });
             if (navigator.canShare({ files: [file] })) {
               navigator.share({ title: f.nom, files: [file] }).catch(err => {
                 if (err && err.name !== 'AbortError') showToast('Erreur partage web');
               });
             } else {
               downloadFile(blob, `fiche-${slugify(f.nom)}.png`);
               showToast('PNG téléchargé');
             }
          } else {
             downloadFile(blob, `fiche-${slugify(f.nom)}.png`);
             showToast('PNG téléchargé');
          }
        };
        reader.onerror = () => showToast('Erreur de lecture du fichier');
        reader.readAsDataURL(blob);
      }, 'image/png');
    } catch (e) {
      console.error(e);
      showToast('Erreur capture : ' + e.message);
    }
  });

  wrap.querySelector('#btn-fullscreen').addEventListener('click', () => {
    const overlay = wrap.querySelector('#fs-overlay');
    overlay.classList.add('show');
    const fsFiche = wrap.querySelector('#fiche-render-fs');
    const ratio = Math.min(1.5, (window.innerWidth - 20) / 600);
    fsFiche.style.zoom = ratio;
  });
  wrap.querySelector('#btn-close-fs').addEventListener('click', () => {
    wrap.querySelector('#fs-overlay').classList.remove('show');
  });

  wrap.querySelector('#btn-export-png').addEventListener('click', async () => {
    const target = wrap.querySelector('#fiche-render');
    showToast('Génération de l’image…');

      const canvas = await html2canvas(target, { backgroundColor: '#ffffff', scale: 2, useCORS: true });
      // canvas.toBlob() pour produire un vrai Blob (compatible Android bridge)
      canvas.toBlob((blob) => {
        if (!blob) { showToast('Erreur export PNG'); return; }
        downloadFile(blob, `fiche-${slugify(f.nom)}.png`);
        showToast('PNG téléchargé');
      }, 'image/png');
    } catch (e) {
      console.error(e); showToast('Erreur export PNG');
    }
  });

  wrap.querySelector('#btn-export-html').addEventListener('click', () => {
    const html = buildStandaloneHTML(f);
    const blob = new Blob([html], { type: 'text/html' });
    downloadFile(blob, `fiche-${slugify(f.nom)}.html`);
    showToast('HTML téléchargé');
  });

  wrap.querySelector('#btn-print').addEventListener('click', () => {
    window.print();
  });

  return wrap;
}

// Éclaircit une couleur hex vers le blanc (amount entre 0 et 1)
function lighten(hex, amount = 0.85) {
  const m = String(hex || '').replace('#', '').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if (!m) return hex || '#d1ecf7';
  const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
  const blend = c => Math.round(c + (255 - c) * amount);
  const hx = c => blend(c).toString(16).padStart(2, '0');
  return '#' + hx(r) + hx(g) + hx(b);
}

function darken(hex, amount = 0.3) {
  const m = String(hex || '').replace('#', '').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if (!m) return hex || '#1f2d5a';
  const r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
  const blend = c => Math.round(c * (1 - amount));
  const hx = c => blend(c).toString(16).padStart(2, '0');
  return '#' + hx(r) + hx(g) + hx(b);
}



/**
 * Extrait une PAIRE de couleurs contrastées pour les sens 1/2.
 *
 * Algorithme :
 * 1. Quantization : chaque pixel est binné dans une grille 5×5×5 (125 bins).
 *    On ignore le blanc (>240), le noir (<20) et les couleurs désaturées (<20% sat).
 * 2. Sens 1 = bin le plus rempli → couleur dominante.
 * 3. Sens 2 = on parcourt les bins suivants par poids décroissant, et on prend le
 *    PREMIER qui a une teinte (hue HSL) significativement différente de la première
 *    (>60° d'écart sur le cercle chromatique 0-360°) et un poids ≥ 8% du max.
 *    Ça évite que sens2 soit juste un assombri de sens1 (ancien comportement).
 *    Exemples concrets attendus :
 *      - Planète Sciences → bleu marine + rose magenta
 *      - Eurobot          → bleu marine + jaune
 *      - Logo monochrome  → fallback darken(main, 0.5) (plus tranché qu'avant 0.4)
 */
function extractThemeFromImage(img) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const SAMPLE = 80;
  canvas.width = SAMPLE; canvas.height = SAMPLE;
  ctx.drawImage(img, 0, 0, SAMPLE, SAMPLE);
  const data = ctx.getImageData(0, 0, SAMPLE, SAMPLE).data;

  // Helper local : RGB (0-255) → teinte HSL en degrés (0-360)
  const rgbToHue = (r, g, b) => {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b);
    const min = Math.min(r, g, b);
    const d = max - min;
    if (d === 0) return 0;
    let h;
    if (max === r)      h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else                h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
    return h;
  };

  // Bins : on découpe chaque canal R/G/B en 5 segments → 125 bins
  const bins = new Map();
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
    if (a < 128) continue;
    if (r > 240 && g > 240 && b > 240) continue;
    if (r < 20 && g < 20 && b < 20) continue;
    const maxC = Math.max(r, g, b);
    const minC = Math.min(r, g, b);
    const saturation = maxC === 0 ? 0 : (maxC - minC) / maxC;
    if (saturation < 0.20) continue;

    const br = Math.floor(r / 51);
    const bg = Math.floor(g / 51);
    const bb = Math.floor(b / 51);
    const key = `${br}-${bg}-${bb}`;
    if (!bins.has(key)) bins.set(key, { r: 0, g: 0, b: 0, count: 0 });
    const bin = bins.get(key);
    bin.r += r; bin.g += g; bin.b += b; bin.count++;
  }

  if (bins.size === 0) {
    return { main: '#005bb0', dark: '#ed1e79' };
  }

  // Helpers de conversion d'un bin
  const binAvg   = (bin) => ({ r: bin.r / bin.count, g: bin.g / bin.count, b: bin.b / bin.count });
  const binToHex = (bin) => {
    const hx = (c) => Math.round(c / bin.count).toString(16).padStart(2, '0');
    return `#${hx(bin.r)}${hx(bin.g)}${hx(bin.b)}`;
  };

  // Bins triés par poids décroissant
  const sortedBins = Array.from(bins.values()).sort((a, b) => b.count - a.count);
  const best = sortedBins[0];
  const main = binToHex(best);

  // Calcul de la teinte de la couleur dominante
  const bestAvg = binAvg(best);
  const mainHue = rgbToHue(bestAvg.r, bestAvg.g, bestAvg.b);

  // Recherche d'une 2e couleur avec teinte significativement différente.
  // Critères : poids ≥ 8% du max ET écart de hue > 60° (sur cercle chromatique).
  const MIN_WEIGHT_RATIO = 0.08;
  const MIN_HUE_DIFF_DEG = 60;
  const minWeight = best.count * MIN_WEIGHT_RATIO;
  let secondBin = null;
  for (let i = 1; i < sortedBins.length; i++) {
    const bin = sortedBins[i];
    if (bin.count < minWeight) break;
    const avg = binAvg(bin);
    const binHue = rgbToHue(avg.r, avg.g, avg.b);
    // Écart angulaire sur le cercle chromatique (jamais > 180°)
    const rawDiff = Math.abs(mainHue - binHue);
    const hueDiff = Math.min(rawDiff, 360 - rawDiff);
    if (hueDiff > MIN_HUE_DIFF_DEG) {
      secondBin = bin;
      break;
    }
  }

  const dark = secondBin ? binToHex(secondBin) : darken(main, 0.5);
  return { main, dark };
}

function renderFicheHTML(f) {

  html += `

      <img class="big-logo" src="${escapeAttr(f.logo || '')}" alt="logo" />
      <div class="fiche-titles">
        <div class="main-title">${escapeHtml(f.titre)}</div>
        <div class="periode" style="color: ${c1};">${escapeHtml(f.periode)}</div>
        <div class="jours">${escapeHtml(joursToString(f.joursCoches))}</div>
      </div>
    </div>`;

  for (let i = 0; i < 2; i++) {
    const sens = f.sens[i];
    const dep = sens.depart || '?';
    const arr = sens.arrivee || '?';
    const sc = i === 0 ? c1 : c2;
    const scl = i === 0 ? c1l : c2l;

    html += `<div class="sens-block" style="--c-main: ${sc}; --c-light: ${scl};">`;
    html += `<h3 class="sens-title">${escapeHtml(dep)} <span class="arrow">›</span> ${escapeHtml(arr)}</h3>`;
    if (sens.arrets.length === 0) {
      html += '<p style="color:#888; font-size:13px; font-style:italic; margin: 4px 0 12px;">Aucun arrêt configuré.</p>';
      html += '</div>';
      continue;
    }
    if (sens.matin.length > 0) {
      html += `<h4 class="period-title">Matin</h4>`;
      html += buildTableHTML(sens, sens.matin);
    }
    if (sens.soir.length > 0) {
      html += `<h4 class="period-title">Soir</h4>`;
      html += buildTableHTML(sens, sens.soir);
    }
    if (sens.matin.length === 0 && sens.soir.length === 0) {
      html += '<p style="color:#888; font-size:13px; font-style:italic; margin: 4px 0 12px;">Aucun horaire saisi.</p>';
    }
    html += '</div>';
  }

  if (f.legende && f.legende.trim()) {
    const lignes = f.legende.split(/\r?\n/).filter(l => l.trim()).map(l => escapeHtml(l));
    html += `<div class="fiche-legende"><span class="lbl">Légende</span>${lignes.join('<br>')}</div>`;
  }

  html += `
    <div class="fiche-footer">
      <strong>ATTENTION :</strong> les horaires de passage aux arrêts sont fournis à titre indicatif.
      Il est conseillé de prévoir une marge de sécurité.
    </div>`;
  return html;
}

// Parse une cellule horaire : accepte "HH:MM", "HH.MM", "HHhMM", "HHHMM"
function parseTime(raw) {
  if (!raw) return { raw: '', hour: null, min: null };
  const s = String(raw).trim();
  const m = s.match(/^(\d{1,2})\s*[:.hH]\s*(\d{1,2})$/);
  if (m) {
    const h = parseInt(m[1], 10);
    const mi = parseInt(m[2], 10);
    if (h >= 0 && h <= 23 && mi >= 0 && mi <= 59) {
      return { raw: s, hour: h, min: mi };
    }
  }
  return { raw: s, hour: null, min: null };
}

function buildTableHTML(sens, columns) {
  if (columns.length === 0) return '';
  const nArrets = sens.arrets.length;
  const singleStop = nArrets === 1;

  // 1) Parse toutes les cellules
  const parsedCols = columns.map(col => col.map(parseTime));

  // 2) Heure de référence de chaque colonne (1er arrêt parsable)
  const colRefHours = parsedCols.map(col => {
    for (const p of col) if (p.hour !== null) return p.hour;
    return null;
  });

  // 3) Heures pleines distinctes (triées)
  const hourSet = new Set();
  colRefHours.forEach(h => { if (h !== null) hourSet.add(h); });
  const sortedHours = [...hourSet].sort((a, b) => a - b);

  // 4) Colonnes "non parsables"
  const extraColIndexes = [];
  colRefHours.forEach((h, i) => { if (h === null) extraColIndexes.push(i); });

  // 5) Matrice cellsByHour[arret][heure] = [valeurs]
  const cellsByHour = {};
  for (let r = 0; r < nArrets; r++) cellsByHour[r] = {};
  for (let c = 0; c < parsedCols.length; c++) {
    const refH = colRefHours[c];
    if (refH === null) continue;
    for (let r = 0; r < nArrets; r++) {
      const cell = parsedCols[c][r];
      if (!cellsByHour[r][refH]) cellsByHour[r][refH] = [];
      if (cell.hour !== null) {
        if (cell.hour === refH) {
          cellsByHour[r][refH].push(String(cell.min).padStart(2, '0'));
        } else {
          cellsByHour[r][refH].push(`${cell.hour}h${String(cell.min).padStart(2, '0')}`);
        }
      } else if (cell.raw) {
        cellsByHour[r][refH].push(cell.raw);
      }
    }
  }

  // 6) En-tête : si plusieurs arrêts, on garde la colonne arrêt à gauche
  let html = '<table class="fiche-table"><thead><tr>';
  if (!singleStop) html += '<th class="arret-cell-head"></th>';
  for (const h of sortedHours) {
    html += `<th class="hour-head">${h}h</th>`;
  }
  for (const _ of extraColIndexes) {
    html += `<th class="hour-head">—</th>`;
  }
  html += '</tr></thead><tbody>';

  // 7) Lignes
  for (let r = 0; r < nArrets; r++) {
    let cls = '';
    if (!singleStop) {
      if (r === 0) cls = 'terminus-start';
      else if (r === nArrets - 1) cls = 'terminus-end';
    } else {
      cls = 'terminus-start';
    }
    html += `<tr class="${cls}">`;
    if (!singleStop) html += `<td class="arret-cell">${escapeHtml(sens.arrets[r] || '')}</td>`;

    for (const h of sortedHours) {
      const values = cellsByHour[r][h] || [];
      if (values.length === 0) {
        html += '<td class="hour-cell empty-cell">—</td>';
      } else {
        const inner = values.map(v => `<div class="min-row">${escapeHtml(v)}</div>`).join('');
        html += `<td class="hour-cell">${inner}</td>`;
      }
    }

    for (const ci of extraColIndexes) {
      const cell = parsedCols[ci][r];
      if (cell.raw) html += `<td class="hour-cell">${escapeHtml(cell.raw)}</td>`;
      else html += '<td class="hour-cell empty-cell">—</td>';
    }

    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

// ---------- ACTIONS GLOBALES ----------
function handleBack() {
  // 1. Fermer le plein écran si ouvert
  const fsOverlay = document.getElementById('fs-overlay');
  if (fsOverlay && fsOverlay.classList.contains('show')) {
    fsOverlay.classList.remove('show');
    return true;
  }

  // 2. Fermer la modale si ouverte
  const modalOverlay = document.getElementById('modal-overlay');
  if (modalOverlay && modalOverlay.classList.contains('show')) {
    modalOverlay.classList.remove('show');
    return true;
  }

  // 3. Retourner à l'accueil si on est dans une fiche
  if (state.currentFicheId !== null) {
    state.currentFicheId = null;
    saveState();
    render();
    return true;
  }

  return false; // Déjà à l'accueil
}

function createFiche() {
  const f = newFiche();
  state.fiches.push(f);
  state.currentFicheId = f.id;
  state.activeTab = 'general';
  saveState(); render(); showToast('Nouvelle fiche créée');
}

document.getElementById('btn-new-fiche').addEventListener('click', createFiche);
document.getElementById('btn-export-all').addEventListener('click', exportAllJSON);
document.getElementById('btn-import-all').addEventListener('click', () => document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change', (e) => {
  if (e.target.files[0]) importAllJSON(e.target.files[0]);
  e.target.value = '';
});

(function init() {
  checkStorage();
  if (!storageAvailable) showStorageWarning();
  loadState();
  render();

  document.getElementById('app-title').addEventListener('click', () => {
    state.currentFicheId = null;
    saveState();
    render();
  });

  // ============================================================
  // LIVE PREVIEW SUR TABLETTE (≥1024px) — ajout auto
  // ============================================================
  (function setupLivePreview() {
    const MIN_WIDTH = 1024;
    let livePanel = null;
    let updateTimer = null;

    function isTablet() {
      return window.innerWidth >= MIN_WIDTH;
    }

    function ensurePanel() {
      if (livePanel || !isTablet()) return livePanel;
      const main = document.querySelector('main');
      if (!main) return null;
      livePanel = document.createElement('aside');
      livePanel.id = 'live-preview';
      livePanel.setAttribute('aria-label', 'Aperçu en temps réel');
      main.appendChild(livePanel);
      return livePanel;
    }

    function refreshLivePreview() {
      if (!isTablet()) {
        if (livePanel) { livePanel.remove(); livePanel = null; }
        return;
      }
      const panel = ensurePanel();
      if (!panel) return;

      const f = (typeof currentFiche === 'function') ? currentFiche() : null;
      if (!f) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = '';
      try {
        panel.innerHTML = '<div class="fiche-render">' + renderFicheHTML(f) + '</div>';
      } catch (e) {
        console.warn('Live preview render failed:', e);
      }
    }

    // Throttle léger : on attend 200ms après la dernière modif avant de re-rendre
    function scheduleRefresh() {
      if (updateTimer) clearTimeout(updateTimer);
      updateTimer = setTimeout(refreshLivePreview, 200);
    }

    // Écouter toutes les modifs dans le formulaire (event delegation)
    document.addEventListener('input', scheduleRefresh, true);
    document.addEventListener('change', scheduleRefresh, true);
    window.addEventListener('resize', scheduleRefresh);

    // Hook sur render() existant pour rafraîchir après changement de fiche/onglet
    if (typeof render === 'function') {
      const _origRender = render;
      window.render = function() {
        const r = _origRender.apply(this, arguments);
        scheduleRefresh();
        return r;
      };
    }

    // Premier rendu
